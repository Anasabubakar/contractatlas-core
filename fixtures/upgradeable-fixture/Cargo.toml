[package]
name = "upgradeable-fixture"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Test fixture for ContractAtlas: a minimal upgradeable contract. Not an audited contract and not for production use."

[lib]
crate-type = ["cdylib"]
doctest = false

[features]
# Build with --features v2 to produce a second, different artifact.
v2 = []

[dependencies]
soroban-sdk = "=28.0.0"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
